<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RSS Pal">
  <title>RSS Pal</title>
  <desc>A rounded blue RSS icon with a saved-reading progress mark.</desc>
  <rect class="rss-pal-favicon-bg" width="64" height="64" rx="14" fill="#2563eb"/>
  <path class="rss-pal-favicon-wave" d="M17 28c10.5 0 19 8.5 19 19" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path class="rss-pal-favicon-wave" d="M17 16c17.1 0 31 13.9 31 31" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle class="rss-pal-favicon-wave" cx="19" cy="46" r="5" fill="#ffffff"/>
  <path class="rss-pal-favicon-progress" d="M14 54h36" fill="none" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
  <path class="rss-pal-favicon-progress" d="M14 54h21" fill="none" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
</svg>
