<h1>共享到 RSS Pal</h1>
<p><a class="install" data-shortcut-install href="workflow://shortcuts/fcb8824905304acb9cb0e272f8b7e5c0">添加到快捷指令</a></p>
<p>打开后在系统页面确认添加，无需手动配置动作。</p>
<p>安装后，请返回 RSS Pal 设置连接一次当前账号。以后长按链接 → 共享 → 加入 RSS Pal，即可直接保存到网摘。</p>
<p>浏览器和添加到主屏幕的 App 都能连接，不需要在 Chrome 里另外登录。已有旧版快捷指令时，请替换为新版。</p>
<p><a href="https://www.icloud.com/shortcuts/fcb8824905304acb9cb0e272f8b7e5c0">使用 Apple 安装页</a></p>
