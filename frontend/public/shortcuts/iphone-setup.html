<h1>共享到 RSS Pal</h1>
<p><a class="install" data-shortcut-install href="workflow://shortcuts/bee8c10b751e47a18d87fb75f889b3d3">添加到快捷指令</a></p>
<p>打开后在系统页面确认添加，无需手动配置动作。</p>
<p>添加后：长按链接 → 共享 → 加入 RSS Pal → 加入抓取。</p>
<p>首次使用请在打开的浏览器中登录 RSS Pal。共享链接会保存为独立网摘。</p>
