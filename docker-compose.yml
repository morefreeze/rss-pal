version: '3.8'

x-task-budget-environment: &task-budget-environment
  TASK_AI_DAILY: ${TASK_AI_DAILY:-50}
  TASK_AI_GLOBAL_DAILY: ${TASK_AI_GLOBAL_DAILY:-1000}
  TASK_AI_CONCURRENT: ${TASK_AI_CONCURRENT:-2}
  TASK_AI_GLOBAL_CONCURRENT: ${TASK_AI_GLOBAL_CONCURRENT:-4}
  TASK_INTERACTIVE_DAILY: ${TASK_INTERACTIVE_DAILY:-300}
  TASK_INTERACTIVE_GLOBAL_DAILY: ${TASK_INTERACTIVE_GLOBAL_DAILY:-10000}
  TASK_INTERACTIVE_CONCURRENT: ${TASK_INTERACTIVE_CONCURRENT:-2}
  TASK_INTERACTIVE_GLOBAL_CONCURRENT: ${TASK_INTERACTIVE_GLOBAL_CONCURRENT:-20}
  TASK_FETCH_DAILY: ${TASK_FETCH_DAILY:-100}
  TASK_FETCH_GLOBAL_DAILY: ${TASK_FETCH_GLOBAL_DAILY:-5000}
  TASK_FETCH_CONCURRENT: ${TASK_FETCH_CONCURRENT:-2}
  TASK_FETCH_GLOBAL_CONCURRENT: ${TASK_FETCH_GLOBAL_CONCURRENT:-10}
  TASK_CAPTURE_DAILY: ${TASK_CAPTURE_DAILY:-100}
  TASK_CAPTURE_GLOBAL_DAILY: ${TASK_CAPTURE_GLOBAL_DAILY:-5000}
  TASK_CAPTURE_CONCURRENT: ${TASK_CAPTURE_CONCURRENT:-2}
  TASK_CAPTURE_GLOBAL_CONCURRENT: ${TASK_CAPTURE_GLOBAL_CONCURRENT:-10}
  TASK_PDF_DAILY: ${TASK_PDF_DAILY:-10}
  TASK_PDF_GLOBAL_DAILY: ${TASK_PDF_GLOBAL_DAILY:-300}
  TASK_PDF_CONCURRENT: ${TASK_PDF_CONCURRENT:-1}
  TASK_PDF_GLOBAL_CONCURRENT: ${TASK_PDF_GLOBAL_CONCURRENT:-3}
  TASK_SUBSCRIBE_DAILY: ${TASK_SUBSCRIBE_DAILY:-30}
  TASK_SUBSCRIBE_GLOBAL_DAILY: ${TASK_SUBSCRIBE_GLOBAL_DAILY:-1000}
  TASK_SUBSCRIBE_CONCURRENT: ${TASK_SUBSCRIBE_CONCURRENT:-2}
  TASK_SUBSCRIBE_GLOBAL_CONCURRENT: ${TASK_SUBSCRIBE_GLOBAL_CONCURRENT:-10}
  TASK_BACKGROUND_FETCH_DAILY: ${TASK_BACKGROUND_FETCH_DAILY:-500}
  TASK_BACKGROUND_FETCH_GLOBAL_DAILY: ${TASK_BACKGROUND_FETCH_GLOBAL_DAILY:-5000}
  TASK_BACKGROUND_FETCH_CONCURRENT: ${TASK_BACKGROUND_FETCH_CONCURRENT:-2}
  TASK_BACKGROUND_FETCH_GLOBAL_CONCURRENT: ${TASK_BACKGROUND_FETCH_GLOBAL_CONCURRENT:-5}
  TASK_BACKGROUND_OCR_DAILY: ${TASK_BACKGROUND_OCR_DAILY:-10}
  TASK_BACKGROUND_OCR_GLOBAL_DAILY: ${TASK_BACKGROUND_OCR_GLOBAL_DAILY:-100}
  TASK_BACKGROUND_OCR_CONCURRENT: ${TASK_BACKGROUND_OCR_CONCURRENT:-1}
  TASK_BACKGROUND_OCR_GLOBAL_CONCURRENT: ${TASK_BACKGROUND_OCR_GLOBAL_CONCURRENT:-2}

services:
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      # postgres role password on fresh init. After Phase 3 RLS rollout, the
      # runtime DB_PASSWORD belongs to rsspal_app — the postgres superuser
      # password lives in DB_ADMIN_PASSWORD. Back-compat: if DB_ADMIN_PASSWORD
      # is unset, fall back to DB_PASSWORD (pre-Phase-3 deployments).
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD required in .env}}
      POSTGRES_DB: rsspal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs once after PostgreSQL is ready so existing database volumes receive
  # the current subscription Explore schema before either service accesses it.
  status-migrate:
    image: postgres:15-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: rsspal
      PGUSER: ${DB_ADMIN_USER:-postgres}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD required in .env}}
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "psql -v ON_ERROR_STOP=1 -f /migrations/037_service_heartbeats.sql && psql -v ON_ERROR_STOP=1 -f /migrations/038_subscription_explore.sql && psql -v ON_ERROR_STOP=1 -f /migrations/039_article_shares.sql && psql -v ON_ERROR_STOP=1 -f /migrations/040_explore_provider_materialized_at.sql && psql -v ON_ERROR_STOP=1 -f /migrations/041_article_share_short_codes.sql && psql -v ON_ERROR_STOP=1 -f /migrations/042_auth_rate_limits.sql && psql -v ON_ERROR_STOP=1 -f /migrations/043_task_budgets.sql && psql -v ON_ERROR_STOP=1 -f /migrations/044_user_subscriptions.sql"]

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    environment:
      <<: *task-budget-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      # Separate admin creds for backup/restore (NewAdminDB). Falls back to
      # DB_USER/DB_PASSWORD when unset so pre-Phase-3 deployments keep working.
      DB_ADMIN_USER: ${DB_ADMIN_USER:-${DB_USER:-postgres}}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: rsspal
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-https://api.anthropic.com}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-glm-5.3}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-glm-5v-turbo}
      AI_VISION_MAX_IMAGES: ${AI_VISION_MAX_IMAGES:-6}
      AI_VISION_MAX_LONG_SIDE: ${AI_VISION_MAX_LONG_SIDE:-1024}
      AI_VISION_PAYLOAD_BUDGET_MB: ${AI_VISION_PAYLOAD_BUDGET_MB:-4}
      AI_VISION_MIN_IMAGES: ${AI_VISION_MIN_IMAGES:-3}
      AI_VISION_MAX_TEXT_CHARS: ${AI_VISION_MAX_TEXT_CHARS:-2000}
      AI_VISION_CACHE_DIR: ${AI_VISION_CACHE_DIR:-/backups/ai_summary_cache}
      AI_VISION_CACHE_TTL_HOURS: ${AI_VISION_CACHE_TTL_HOURS:-24}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD required in .env}
      AUTH_CAPTCHA_PROVIDER: ${AUTH_CAPTCHA_PROVIDER:-tencent}
      TENCENT_CAPTCHA_APP_ID: ${TENCENT_CAPTCHA_APP_ID:-}
      TENCENT_CAPTCHA_APP_SECRET: ${TENCENT_CAPTCHA_APP_SECRET:-}
      TENCENT_CAPTCHA_SECRET_ID: ${TENCENT_CAPTCHA_SECRET_ID:-}
      TENCENT_CAPTCHA_SECRET_KEY: ${TENCENT_CAPTCHA_SECRET_KEY:-}
      SHARE_REGISTRATION_MODE: ${SHARE_REGISTRATION_MODE:-selected_owners}
      SHARE_REGISTRATION_OWNER_IDS: ${SHARE_REGISTRATION_OWNER_IDS:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-rss.morefreeze.top}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env}
      SHARE_SECRET: ${SHARE_SECRET:?SHARE_SECRET required in .env}
      SHORT_SHARE_ORIGIN: ${SHORT_SHARE_ORIGIN:?SHORT_SHARE_ORIGIN required in .env}
      JINA_API_KEY: ${JINA_API_KEY}
      ZAI_READER_API_KEY: ${ZAI_READER_API_KEY:-}
      ZAI_READER_MCP_URL: ${ZAI_READER_MCP_URL:-}
      SERVER_PORT: 8080
      RSSHUB_BASE_URL: http://rsshub:1200
      YOUTUBE_POT_PROVIDER_URL: http://youtube-pot:4416
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
      status-migrate:
        condition: service_completed_successfully
      rsshub:
        condition: service_started
      youtube-pot:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Host-mounted so backups survive `docker compose down -v` and a fresh
      # rebuild can discover prior snapshots for restore.
      - ./backups:/backups

  worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      network: host
    environment:
      <<: *task-budget-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required in .env}
      DB_NAME: rsspal
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-https://api.anthropic.com}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-glm-5.3}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-glm-5v-turbo}
      AI_VISION_MAX_IMAGES: ${AI_VISION_MAX_IMAGES:-6}
      AI_VISION_MAX_LONG_SIDE: ${AI_VISION_MAX_LONG_SIDE:-1024}
      AI_VISION_PAYLOAD_BUDGET_MB: ${AI_VISION_PAYLOAD_BUDGET_MB:-4}
      AI_VISION_MIN_IMAGES: ${AI_VISION_MIN_IMAGES:-3}
      AI_VISION_MAX_TEXT_CHARS: ${AI_VISION_MAX_TEXT_CHARS:-2000}
      AI_VISION_CACHE_DIR: ${AI_VISION_CACHE_DIR:-/backups/ai_summary_cache}
      AI_VISION_CACHE_TTL_HOURS: ${AI_VISION_CACHE_TTL_HOURS:-24}
      JINA_API_KEY: ${JINA_API_KEY}
      ZAI_READER_API_KEY: ${ZAI_READER_API_KEY:-}
      ZAI_READER_MCP_URL: ${ZAI_READER_MCP_URL:-}
      EXPLORE_FETCH_BATCH_LIMIT: ${EXPLORE_FETCH_BATCH_LIMIT:-500}
      EXPLORE_FETCH_CONCURRENCY: ${EXPLORE_FETCH_CONCURRENCY:-5}
      RSSHUB_BASE_URL: http://rsshub:1200
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
      status-migrate:
        condition: service_completed_successfully
      rsshub:
        condition: service_started
    volumes:
      - ./backups:/backups

  rsshub:
    # chromium-bundled tag ships Playwright + headless Chromium so routes
    # that need browser-mode (e.g. Bilibili user/video which now requires
    # signing) actually work end-to-end.
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 3600
      REQUEST_TIMEOUT: 30000
      # Bilibili needs a logged-in cookie to bypass anti-bot; set BILIBILI_COOKIE
      # in .env (DevTools → Cookies → bilibili.com → copy the full cookie string).
      BILIBILI_COOKIE_DEFAULT: ${BILIBILI_COOKIE:-}

  youtube-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

  status-monitor:
    build:
      context: ./status-monitor
      dockerfile: Dockerfile
    environment:
      FRONTEND_URL: http://frontend:80/
      API_HEALTH_URL: http://api:8080/api/health
      WORKER_HEALTH_URL: http://api:8080/api/internal/health/worker
      RSSHUB_HEALTH_URL: http://rsshub:1200/
      PUBLIC_HEALTH_URL: https://rss.morefreeze.top/api/health
      CHECK_INTERVAL: 60
      MONITOR_PORT: 8090
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - status_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  status_data:
